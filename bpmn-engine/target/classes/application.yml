spring:
  application:
    name: bpmn-engine

  jackson:
    serialization:
      write-dates-as-timestamps: false

  datasource:
    url: jdbc:h2:file:./data/bpmndb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect

  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: false

  quartz:
    job-store-type: memory          # RAM store — timer state is owned by the job table via JPA
    properties:
      org:
        quartz:
          scheduler:
            instanceName: BpmnEngineScheduler
            instanceId: NON_CLUSTERED
          threadPool:
            threadCount: 5

server:
  port: 8080

logging:
  level:
    com.bpmnengine: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE

bpmn:
  engine:
    async-executor-enabled: true
    history-level: FULL   # NONE | ACTIVITY | AUDIT | FULL
    default-timezone: UTC
